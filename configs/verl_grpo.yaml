# verl GRPO config for AtmoZero post-training.
# Launch: bash scripts/run_verl.sh

trainer:
  project_name: atmozero
  experiment_name: default
  total_epochs: 1
  total_training_steps: 2450
  save_freq: 250
  test_freq: 250
  default_local_dir: <YOUR_RUN_DIR>
  logger: ['console']
  n_gpus_per_node: 4
  nnodes: 1

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: true
  kl_ctrl:
    type: fixed
    kl_coef: 0.025

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: Qwen/Qwen2.5-7B-Instruct
    enable_gradient_checkpointing: true
    use_remove_padding: true
  actor:
    strategy: fsdp2
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 4
    ppo_epochs: 1
    clip_ratio: 0.20
    entropy_coeff: 0.0
    grad_clip: 1.0
    optim:
      lr: 4.8e-6
      weight_decay: 0.08
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  ref:
    fsdp_config:
      param_offload: true
  rollout:
    name: vllm
    n: 8                 # GRPO group size G
    temperature: 1.0
    top_p: 0.95
    response_length: 384
    gpu_memory_utilization: 0.6
    tensor_model_parallel_size: 1

data:
  train_files: ['data/processed/verl_train.parquet']
  val_files: ['data/processed/verl_val.parquet']
  prompt_key: prompt
  max_prompt_length: 1024
  max_response_length: 384
  train_batch_size: 32
  val_batch_size: 32
  shuffle: true
  custom_cls:
    path: atmozero/verl_dataset.py
    name: AtmoZeroDataset

custom_reward_function:
  path: atmozero/verl_reward.py
  name: compute_score
